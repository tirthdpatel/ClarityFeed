# Countries.
#
# `is_enabled: true` marks the 12 launch countries (ARCHITECTURE_V3 Part H).
# The rest are seeded but hidden — better four good sources for twelve
# countries than one dead feed for fifty. Enabling one is an admin-panel
# toggle, not a migration.
#
# `default_language` is the language most of that country's coverage is
# written in. It is a hint for the classifier and translation pipeline, not a
# constraint — an English article about France is still about France.
#
# EVERY VALUE IS QUOTED ON PURPOSE. In YAML 1.1 the bare tokens NO, ON, OFF,
# YES and N are booleans, so Norway's iso2 "NO" would silently load as False.
# Quoting sidesteps the whole category.

