# Category taxonomy — ARCHITECTURE_V3 Part C.
#
# 10 top-level, 38 children. `parent` is the parent's slug; top-level entries
# omit it. This is seeded data in `category_defs`, NOT hardcoded — the brief
# required categories be manageable without code changes, so the admin panel
# owns this at runtime and this file is only the starting point.
#
# `keywords` drive the rule-based classifier. They are deliberately specific:
# a keyword that fires on half the corpus is worse than no keyword at all.
# Matching is case-insensitive on word boundaries over title + description.
#
# AI sits UNDER Technology, not beside it. Readers look for it there, and the
# parent relationship means an AI article appears in Technology feeds without
# a second assignment. `is_primary` on article_categories decides which one
# leads; the parent is implied by the tree and never stored twice.

# ---------------------------------------------------------------- top level
- {slug: "world",       name: "World",                 sort_order: 10,  color_token: "cat-world"}
- {slug: "politics",    name: "Politics",              sort_order: 20,  color_token: "cat-politics"}
- {slug: "business",    name: "Business",              sort_order: 30,  color_token: "cat-business"}
- {slug: "technology",  name: "Technology",            sort_order: 40,  color_token: "cat-tech"}
- {slug: "science",     name: "Science",               sort_order: 50,  color_token: "cat-science"}
- {slug: "health",      name: "Health",                sort_order: 60,  color_token: "cat-health"}
- {slug: "sports",      name: "Sports",                sort_order: 70,  color_token: "cat-sports"}
- {slug: "culture",     name: "Culture",               sort_order: 80,  color_token: "cat-culture"}
- {slug: "environment", name: "Climate & Environment", sort_order: 90,  color_token: "cat-environment"}
- {slug: "society",     name: "Society",               sort_order: 100, color_token: "cat-society"}

