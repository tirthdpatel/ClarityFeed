name: Secret scan

# The pre-commit hook is a local convenience and can be skipped with
# `git commit --no-verify`, or simply never installed on a fresh clone.
# This job is the one that actually holds the line.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a credential removed in the latest commit is still
          # live if it is sitting in an earlier one.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files
        run: python scripts/check_secrets.py

      - name: Assert no environment file is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it and rotate every credential it contained."
            exit 1
          fi
          tracked_env=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked_env" ]; then
            echo "::error::environment files are tracked: $tracked_env"
            exit 1
          fi
          echo "No environment files tracked."

      - name: Scan full git history
        run: |
          # Catches a secret committed earlier and "removed" later — deleting
          # it from HEAD does not delete it from history, and anything that
          # ever reached a public repo must be treated as compromised.
          if git log -p --all \
            | grep -nEi 'gsk_[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|postgres(ql)?://[^[:space:]:/@]+:[^[:space:]@\[]{8,}@' \
            | grep -viE 'your-password|user:password|xxxxxxxx|placeholder|example\.com' ; then
            echo "::error::A credential appears in git history. Rotate it — removing the commit is not sufficient."
            exit 1
          fi
          echo "History clean."
