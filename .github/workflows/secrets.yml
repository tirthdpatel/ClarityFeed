name: Secret scan

# The pre-commit hook is a local convenience and can be skipped with
# `git commit --no-verify`, or simply never installed on a fresh clone.
# This job is the one that actually holds the line.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a credential removed in the latest commit is still
          # live if it is sitting in an earlier one.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files
        run: python scripts/check_secrets.py

      - name: Assert no environment file is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it and rotate every credential it contained."
            exit 1
          fi
          tracked_env=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked_env" ]; then
            echo "::error::environment files are tracked: $tracked_env"
            exit 1
          fi
          echo "No environment files tracked."

      - name: Scan full git history
        # Catches a secret committed earlier and "removed" later — deleting it
        # from HEAD does not delete it from history, and anything that ever
        # reached a remote must be treated as compromised.
        #
        # This was an inlined `git log -p | grep -E` pipeline. It duplicated the
        # patterns from scripts/check_secrets.py in a second dialect and, having
        # no notion of that file's ALLOWLIST_PATHS, failed on the scanner's own
        # test fixtures — every run since 2026-08-20 was red for a false
        # positive. A check that cries wolf is one somebody eventually deletes.
        #
        # Same rules, same allowlist, one source of truth, and runnable locally:
        #     python scripts/check_secrets.py --history
        run: python scripts/check_secrets.py --history
