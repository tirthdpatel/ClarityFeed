# Single entry point into the cluster.
#
# Only the API is exposed. The frontend in this repo is a separate Vercel
# deployment, so there is no static-file Service to route to — /  goes to the
# API too, which is what serves /health, /ready and /sources.
#
# Needs an ingress controller: `minikube addons enable ingress`, then
#   echo "$(minikube ip) clarity.local" | sudo tee -a /etc/hosts
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clarity
  namespace: clarity
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: clarity.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clarity-api
                port: { number: 8000 }
    # Also reachable without a Host header, so `curl $(minikube ip)` works in a
    # demo before anyone edits /etc/hosts.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clarity-api
                port: { number: 8000 }
