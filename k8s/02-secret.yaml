# TEMPLATE ONLY — committed with empty values so `kubectl apply -k` works on a
# fresh cluster. Never commit real values.
#
# Create the real Secret out of band:
#
#   kubectl -n clarity create secret generic clarity-secrets \
#     --from-literal=DATABASE_URL='postgresql://clarity@clarity-postgres:5432/clarity' \
#     --from-literal=PGPASSWORD='<pw>' \
#     --from-literal=POSTGRES_PASSWORD='<pw>' \
#     --from-literal=GROQ_API_KEY='<key>' \
#     --from-literal=GEMINI_API_KEY='<key>' \
#     --from-literal=HF_API_TOKEN='<token>' \
#     --from-literal=INTERNAL_SECRET="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
#
# DATABASE_URL lives here rather than in the ConfigMap because it names the
# database host and user. The password is NOT in it: libpq reads PGPASSWORD from
# the environment when the URL carries none, so a leaked connection string is
# not a leaked credential. POSTGRES_PASSWORD is the same value, consumed by the
# postgres container itself to initialise the database.
# INTERNAL_SECRET must not be left at its default: config/settings.py refuses to
# start in production if it is, precisely because that default is published in
# this repository.
#
# stringData rather than data, so the template is readable. base64 is encoding,
# not encryption, and treating it as a secret is how keys reach git.
apiVersion: v1
kind: Secret
metadata:
  name: clarity-secrets
  namespace: clarity
type: Opaque
stringData:
  # Every value here is empty on purpose. `make k8s-secrets` builds the real
  # Secret from your gitignored .env; this file exists so `kubectl apply -k`
  # succeeds on a fresh cluster and so the key names are reviewable.
  #
  # Applying this as-is gives you pods that start and fail their readiness
  # probe, which is the correct failure: loud, immediate, and not a silent
  # fallback to a password published in a public repository.
  DATABASE_URL: ""
  PGPASSWORD: ""
  POSTGRES_PASSWORD: ""
  INTERNAL_SECRET: ""
  GROQ_API_KEY: ""
  GEMINI_API_KEY: ""
  HF_API_TOKEN: ""
